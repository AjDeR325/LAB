<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RACE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: white;
        }

        .hero {
            min-height: 70vh;
            display: flex;
            align-items: center;
            padding: 0 8%;

            background:
                linear-gradient(90deg, #080808 20%, transparent),
                url("https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?auto=format&fit=crop&w=1800&q=80")
                center / cover;
        }

        .hero h1 {
            font-size: 100px;
            font-weight: 900;
            letter-spacing: -5px;
        }

        .hero h1 span {
            color: #e60000;
        }

        .hero p {
            margin-top: 15px;
            color: #999;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #e60000;
            color: white;
            text-decoration: none;
        }

        .section {
            padding: 80px 8%;
        }

        .section h2 {
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            padding: 30px;
            background: #111;
            border: 1px solid #222;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #777;
        }

        footer {
            padding: 30px 8%;
            border-top: 1px solid #222;
            color: #555;
        }

        @media (max-width: 700px) {
            nav {
                display: none;
            }

            .hero h1 {
                font-size: 65px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">RACE.</div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Cars</a>
        <a href="#">Drivers</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <div>
        <h1>R<span>A</span>CE</h1>
        <p>Speed. Power. Control.</p>
        <a href="#" class="button">EXPLORE</a>
    </div>
</section>

<section class="section">
    <h2>Racing</h2>

    <div class="cards">
        <div class="card">
            <h3>Cars</h3>
            <p>Мощные автомобили для трассы.</p>
        </div>

        <div class="card">
            <h3>Drivers</h3>
            <p>Лучшие пилоты и команды.</p>
        </div>

        <div class="card">
            <h3>Events</h3>
            <p>Гонки, соревнования и треки.</p>
        </div>
    </div>
</section>

<footer>
    © 2026 RACE.
</footer>

</body>
</html>
